<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="f2-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16192E" flood-opacity="0.08"/>
    </filter>
    <marker id="f2-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4B5563"/>
    </marker>
    <marker id="f2-arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
    <marker id="f2-arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1920" height="1080" fill="#F8FAFC"/>
  <pattern id="grid-f2" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2.5" cy="2.5" r="1.5" fill="#E2E8F0"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid-f2)"/>

  <!-- BOARD HEADER -->
  <rect x="40" y="24" width="1840" height="84" rx="16" fill="#16192E" filter="url(#f2-shadow)"/>
  <rect x="58" y="42" width="46" height="46" rx="12" fill="#3B82F6"/>
  <text x="81" y="72" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">2</text>
  <text x="120" y="60" font-size="21" font-weight="800" fill="#FFFFFF">CHỨC NĂNG 2: ĐĂNG NHẬP HỆ THỐNG &amp; PHÂN QUYỀN (LOGIN &amp; RBAC)</text>
  <text x="120" y="88" font-size="13.5" fill="#60A5FA" font-weight="600">Đề tài: Nền tảng UniLife • Đầy đủ 3 bước: User Flow (FigJam) → Wireframe phác thảo → Mockup chi tiết</text>
  <rect x="1600" y="44" width="260" height="42" rx="21" fill="#3B82F6"/>
  <text x="1730" y="71" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Phan Trí Đức - 24CT1</text>

  <!-- ========================================================================= -->
  <!-- CỘT 1: BƯỚC 1 - USER FLOW (FigJam Style) x: 40, w: 760, h: 935 -->
  <!-- ========================================================================= -->
  <rect x="40" y="125" width="760" height="935" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#f2-shadow)"/>
  <rect x="40" y="125" width="760" height="46" rx="18" fill="#EFF6FF"/>
  <rect x="40" y="150" width="760" height="21" fill="#EFF6FF"/>
  <text x="65" y="155" font-size="16" font-weight="800" fill="#1E40AF">BƯỚC 1: SƠ ĐỒ LUỒNG NGƯỜI DÙNG (USER FLOW DIAGRAM)</text>

  <!-- Node Start -->
  <rect x="65" y="195" width="310" height="42" rx="21" fill="#16192E"/>
  <circle cx="90" cy="216" r="6" fill="#3B82F6"/>
  <text x="220" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Người dùng có nhu cầu đăng nhập</text>

  <!-- Line to Step 1 & 2 ngang -->
  <line x1="220" y1="237" x2="220" y2="260" stroke="#4B5563" stroke-width="2" marker-end="url(#f2-arr)"/>

  <!-- Step 1 -->
  <rect x="65" y="260" width="310" height="54" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="220" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">1. Bấm "Đăng nhập" trên Header</text>
  <text x="220" y="300" text-anchor="middle" font-size="11.5" fill="#1E3A8A">Mở AuthModal (tab Đăng nhập mặc định)</text>

  <line x1="375" y1="287" x2="435" y2="287" stroke="#4B5563" stroke-width="2" marker-end="url(#f2-arr)"/>

  <!-- Step 2 -->
  <rect x="435" y="260" width="335" height="54" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="602" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">2. Nhập Email &amp; Mật khẩu</text>
  <text x="602" y="300" text-anchor="middle" font-size="11.5" fill="#1E3A8A">Nhấn nút "ĐĂNG NHẬP NGAY"</text>

  <!-- Line from Step 2 to Decision 1 -->
  <path d="M 602 314 L 602 345 L 220 345" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#f2-arr)"/>

  <!-- Decision 1: Email có trong hệ thống? center(220, 395) -->
  <polygon points="220,355 330,395 220,435 110,395" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="220" y="391" text-anchor="middle" font-size="12" font-weight="800" fill="#B45309">Email có</text>
  <text x="220" y="407" text-anchor="middle" font-size="12" font-weight="800" fill="#B45309">tồn tại?</text>

  <!-- Error Email Not Found (Right, no overlap) -->
  <line x1="330" y1="395" x2="435" y2="395" stroke="#DC2626" stroke-width="2" marker-end="url(#f2-arr-red)"/>
  <text x="382" y="386" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Không có</text>
  <rect x="435" y="370" width="335" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="602" y="391" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">Báo lỗi: "Không tìm thấy tài khoản email"</text>
  <text x="602" y="409" text-anchor="middle" font-size="10.5" fill="#7F1D1D">Gợi ý chuyển sang tab Đăng ký để tạo mới</text>

  <!-- Decision 1 Yes Down to Decision 2 -->
  <line x1="220" y1="435" x2="220" y2="475" stroke="#059669" stroke-width="2" marker-end="url(#f2-arr-green)"/>
  <text x="234" y="458" font-size="11" font-weight="700" fill="#059669">Có ✓</text>

  <!-- Decision 2: Đúng mật khẩu? center(220, 515) -->
  <polygon points="220,475 330,515 220,555 110,515" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="220" y="511" text-anchor="middle" font-size="12" font-weight="800" fill="#B45309">Mật khẩu</text>
  <text x="220" y="527" text-anchor="middle" font-size="12" font-weight="800" fill="#B45309">chính xác?</text>

  <!-- Error Wrong Password (Right) -->
  <line x1="330" y1="515" x2="435" y2="515" stroke="#DC2626" stroke-width="2" marker-end="url(#f2-arr-red)"/>
  <text x="382" y="506" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Sai pass</text>
  <rect x="435" y="490" width="335" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="602" y="511" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">Báo lỗi: "Mật khẩu không chính xác"</text>
  <text x="602" y="529" text-anchor="middle" font-size="10.5" fill="#7F1D1D">Yêu cầu nhập lại hoặc bấm "Quên mật khẩu"</text>

  <!-- Decision 2 Yes Down to RBAC -->
  <line x1="220" y1="555" x2="220" y2="595" stroke="#059669" stroke-width="2" marker-end="url(#f2-arr-green)"/>
  <text x="234" y="578" font-size="11" font-weight="700" fill="#059669">Đúng ✓</text>

  <!-- Node RBAC Header -->
  <rect x="65" y="595" width="705" height="52" rx="10" fill="#0E7C66"/>
  <text x="417" y="618" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">XÁC THỰC THÀNH CÔNG — HỆ THỐNG PHÂN QUYỀN VAI TRÒ</text>
  <text x="417" y="636" text-anchor="middle" font-size="11.5" fill="#CCFBF1">Thiết lập quyền truy cập chức năng theo User.role trong CSDL</text>

  <!-- 3 Role Cards -->
  <!-- Role 1: Sinh viên -->
  <rect x="65" y="665" width="225" height="110" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="80" y="690" font-size="13" font-weight="800" fill="#92400E">👤 Sinh viên / Khách thuê</text>
  <text x="80" y="712" font-size="11.5" fill="#78350F">• Kích hoạt lưu Yêu thích (❤️)</text>
  <text x="80" y="730" font-size="11.5" fill="#78350F">• Mở chat &amp; gọi điện chủ trọ</text>
  <text x="80" y="748" font-size="11.5" fill="#78350F">• Viết đánh giá &amp; bình luận</text>

  <!-- Role 2: Chủ trọ -->
  <rect x="305" y="665" width="225" height="110" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="320" y="690" font-size="13" font-weight="800" fill="#065F46">🏠 Chủ nhà trọ</text>
  <text x="320" y="712" font-size="11.5" fill="#047857">• Kích hoạt nút "+ Đăng tin trọ"</text>
  <text x="320" y="730" font-size="11.5" fill="#047857">• Quản lý phòng &amp; tin đăng</text>
  <text x="320" y="748" font-size="11.5" fill="#047857">• Phản hồi tin nhắn sinh viên</text>

  <!-- Role 3: Admin -->
  <rect x="545" y="665" width="225" height="110" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="560" y="690" font-size="13" font-weight="800" fill="#991B1B">🛡️ Quản trị viên (Admin)</text>
  <text x="560" y="712" font-size="11.5" fill="#7F1D1D">• Mở tab Quản trị (AdminView)</text>
  <text x="560" y="730" font-size="11.5" fill="#7F1D1D">• Duyệt tin đăng phòng trọ</text>
  <text x="560" y="748" font-size="11.5" fill="#7F1D1D">• Khóa user vi phạm nội quy</text>

  <!-- Down line to System Update -->
  <line x1="417" y1="775" x2="417" y2="805" stroke="#059669" stroke-width="2" marker-end="url(#f2-arr-green)"/>

  <!-- Step System Update -->
  <rect x="65" y="805" width="705" height="58" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="85" y="828" font-size="13.5" font-weight="800" fill="#065F46">✓ Cập nhật trạng thái phiên làm việc (Session State):</text>
  <text x="85" y="847" font-size="12" fill="#047857">• Đóng AuthModal • Hiện Toast: "Chào mừng [Tên]! (Vai trò)" • Header đổi sang Avatar &amp; Menu tài khoản</text>

  <!-- Down line to End -->
  <line x1="417" y1="863" x2="417" y2="895" stroke="#4B5563" stroke-width="2" marker-end="url(#f2-arr)"/>

  <!-- Node End: Nội dung ngữ cảnh thực tế -->
  <rect x="187" y="895" width="460" height="44" rx="22" fill="#059669"/>
  <circle cx="215" cy="917" r="6" fill="#FFFFFF"/>
  <text x="427" y="922" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Đăng nhập thành công &amp; Quyền hạn đã sẵn sàng</text>

  <!-- Bottom Tip -->
  <rect x="65" y="960" width="705" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="80" y="980" font-size="12" font-weight="800" fill="#1E40AF">💡 Cơ chế Bảo mật &amp; Phân quyền RBAC (Role-Based Access Control):</text>
  <text x="80" y="1000" font-size="11" fill="#1E3A8A">• Ngăn chặn truy cập trái phép bằng cách kiểm tra vai trò tại mỗi Action &amp; Route</text>
  <text x="80" y="1018" font-size="11" fill="#1E3A8A">• Hỗ trợ ghi nhớ đăng nhập (Remember me) thông qua mã hóa lưu trữ LocalStorage an toàn</text>
  <text x="80" y="1035" font-size="11" fill="#1E3A8A">• Kiểm tra cờ trạng thái tài khoản `is_banned` trước khi cấp phép đăng nhập</text>


  <!-- ========================================================================= -->
  <!-- CỘT 2: BƯỚC 2 - WIREFRAME (x: 820, w: 510, h: 935) -->
  <!-- ========================================================================= -->
  <rect x="820" y="125" width="510" height="935" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#f2-shadow)"/>
  <rect x="820" y="125" width="510" height="46" rx="18" fill="#F1F5F9"/>
  <rect x="820" y="150" width="510" height="21" fill="#F1F5F9"/>
  <text x="845" y="155" font-size="15.5" font-weight="800" fill="#0F172A">BƯỚC 2: WIREFRAME (PHÁC THẢO BỐ CỤC)</text>

  <!-- Modal Frame -->
  <rect x="845" y="185" width="460" height="855" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Modal Header -->
  <text x="875" y="225" font-size="17" font-weight="800" fill="#0F172A">Đăng nhập hệ thống</text>
  <text x="875" y="247" font-size="12" fill="#64748B">Truy cập để quản lý tin đăng &amp; lưu yêu thích</text>
  <circle cx="1275" cy="225" r="14" fill="#E2E8F0"/>
  <text x="1275" y="230" text-anchor="middle" font-size="13" font-weight="800" fill="#64748B">✕</text>

  <!-- Tab Bar -->
  <rect x="875" y="275" width="400" height="40" rx="8" fill="#E2E8F0"/>
  <rect x="877" y="277" width="198" height="36" rx="7" fill="#475569"/>
  <text x="975" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Đăng nhập</text>
  <text x="1174" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#64748B">Đăng ký</text>

  <!-- Field Email -->
  <text x="875" y="355" font-size="12" font-weight="700" fill="#334155">Email tài khoản (*)</text>
  <rect x="875" y="365" width="400" height="44" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="895" y="393" font-size="12.5" fill="#94A3B8">[✉️] admin@unilife.vn hoặc sv@...</text>

  <!-- Field Pass -->
  <text x="875" y="440" font-size="12" font-weight="700" fill="#334155">Mật khẩu bảo mật (*)</text>
  <rect x="875" y="450" width="400" height="44" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="895" y="478" font-size="12.5" fill="#94A3B8">[🔒] ••••••••••••</text>

  <!-- Checkbox & Link -->
  <rect x="875" y="520" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="905" y="534" font-size="12.5" fill="#64748B">Ghi nhớ đăng nhập</text>
  <text x="1275" y="534" text-anchor="end" font-size="12.5" fill="#334155" text-decoration="underline">Quên mật khẩu?</text>

  <!-- Submit Button -->
  <rect x="875" y="565" width="400" height="48" rx="8" fill="#334155"/>
  <text x="1075" y="595" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">ĐĂNG NHẬP NGAY</text>

  <!-- Demo Box -->
  <rect x="875" y="645" width="400" height="175" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4,4"/>
  <text x="895" y="675" font-size="12.5" font-weight="800" fill="#334155">💡 Tài khoản thử nghiệm nhanh (Demo):</text>
  <text x="895" y="705" font-size="12" fill="#64748B">• Admin: admin@unilife.vn (pass: admin123)</text>
  <text x="895" y="735" font-size="12" fill="#64748B">• Chủ trọ: chotro@unilife.vn (pass: 123456)</text>
  <text x="895" y="765" font-size="12" fill="#64748B">• Sinh viên: sv@unilife.vn (pass: 123456)</text>


  <!-- ========================================================================= -->
  <!-- CỘT 3: BƯỚC 3 - MOCKUP (x: 1350, w: 530, h: 935) -->
  <!-- ========================================================================= -->
  <rect x="1350" y="125" width="530" height="935" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#f2-shadow)"/>
  <rect x="1350" y="125" width="530" height="46" rx="18" fill="#EFF6FF"/>
  <rect x="1350" y="150" width="530" height="21" fill="#EFF6FF"/>
  <text x="1375" y="155" font-size="15.5" font-weight="800" fill="#2563EB">BƯỚC 3: MOCKUP CHI TIẾT (DESIGN SYSTEM UNILIFE)</text>

  <!-- Modal High-fi -->
  <rect x="1375" y="185" width="480" height="855" rx="18" fill="#FFFFFF" stroke="#E0DCD0" stroke-width="1.5" filter="url(#f2-shadow)"/>

  <!-- Modal Header -->
  <text x="1410" y="225" font-size="19" font-weight="800" fill="#16192E">Đăng nhập UniLife</text>
  <text x="1410" y="249" font-size="12.5" fill="#6B6A63">Truy cập để quản lý tin đăng &amp; liên hệ chủ trọ</text>
  <circle cx="1820" cy="225" r="16" fill="#F6F4EE"/>
  <text x="1820" y="231" text-anchor="middle" font-size="15" font-weight="700" fill="#6B6A63">✕</text>

  <!-- Tab Switch Active Coral -->
  <rect x="1410" y="275" width="410" height="44" rx="10" fill="#F6F4EE"/>
  <rect x="1412" y="277" width="203" height="40" rx="8" fill="#FF5D3E"/>
  <text x="1513" y="302" text-anchor="middle" font-size="13.5" font-weight="800" fill="#FFFFFF">Đăng nhập</text>
  <text x="1716" y="302" text-anchor="middle" font-size="13.5" font-weight="600" fill="#6B6A63">Đăng ký</text>

  <!-- Field Email Mockup -->
  <text x="1410" y="355" font-size="12.5" font-weight="700" fill="#16192E">Email tài khoản (*)</text>
  <rect x="1410" y="365" width="410" height="44" rx="8" fill="#FFFFFF" stroke="#FF5D3E" stroke-width="1.8"/>
  <text x="1435" y="393" font-size="13.5" fill="#16192E">✉️ admin@unilife.vn</text>

  <!-- Field Pass Mockup -->
  <text x="1410" y="440" font-size="12.5" font-weight="700" fill="#16192E">Mật khẩu bảo mật (*)</text>
  <rect x="1410" y="450" width="410" height="44" rx="8" fill="#FFFFFF" stroke="#E0DCD0" stroke-width="1.5"/>
  <text x="1435" y="478" font-size="13.5" fill="#16192E">🔒 ••••••••••••••••</text>
  <text x="1795" y="478" text-anchor="end" font-size="14">👁️</text>

  <!-- Checkbox & Link Mockup -->
  <rect x="1410" y="520" width="18" height="18" rx="5" fill="#0E7C66"/>
  <text x="1419" y="534" text-anchor="middle" font-size="12" font-weight="900" fill="#FFFFFF">✓</text>
  <text x="1438" y="534" font-size="12.5" fill="#6B6A63">Ghi nhớ đăng nhập</text>
  <text x="1820" y="534" text-anchor="end" font-size="12.5" font-weight="700" fill="#FF5D3E">Quên mật khẩu?</text>

  <!-- Submit CTA Button Mockup -->
  <rect x="1410" y="565" width="410" height="50" rx="10" fill="#FF5D3E"/>
  <text x="1615" y="596" text-anchor="middle" font-size="14.5" font-weight="800" fill="#FFFFFF">ĐĂNG NHẬP NGAY 🚀</text>

  <!-- Quick Demo Pills -->
  <rect x="1410" y="645" width="410" height="185" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="1430" y="675" font-size="13" font-weight="800" fill="#92400E">⚡ Đăng nhập thử nghiệm nhanh 1-Click:</text>

  <rect x="1430" y="692" width="370" height="34" rx="8" fill="#FEE2E2"/>
  <text x="1445" y="714" font-size="12" font-weight="700" fill="#991B1B">🛡️ Admin: admin@unilife.vn (pass: admin123)</text>

  <rect x="1430" y="734" width="370" height="34" rx="8" fill="#ECFDF5"/>
  <text x="1445" y="756" font-size="12" font-weight="700" fill="#065F46">🏠 Chủ trọ: chotro@unilife.vn (pass: 123456)</text>

  <rect x="1430" y="776" width="370" height="34" rx="8" fill="#EFF6FF"/>
  <text x="1445" y="798" font-size="12" font-weight="700" fill="#1E40AF">👤 Sinh viên: sv@unilife.vn (pass: 123456)</text>

</svg>
