<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg">
        <!-- Background -->
        <rect width="1000" height="680" fill="#ffffff" />

        <!-- Title Top -->
        <rect x="220" y="10" width="560" height="42" rx="10" fill="#FFF3CD" stroke="#FFEBAA" stroke-width="2" />
        <text x="500" y="37" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">SƠ ĐỒ TUẦN TỰ - CHỨC NĂNG TÌM KIẾM PHÒNG TRỌ (SEARCH HOUSING)</text>

        <!-- Right Function Box -->
        <rect x="830" y="50" width="150" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="905" y="73" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Tên chức năng:</text>
        <text x="905" y="93" font-size="13" fill="#000000" text-anchor="middle">Tìm kiếm phòng trọ</text>

        <!-- Actor: Khách hàng / Sinh viên -->
        <!-- Stick figure -->
        <circle cx="50" cy="85" r="12" fill="none" stroke="#000000" stroke-width="2" />
        <line x1="50" y1="97" x2="50" y2="125" stroke="#000000" stroke-width="2" />
        <line x1="30" y1="108" x2="70" y2="108" stroke="#000000" stroke-width="2" />
        <line x1="50" y1="125" x2="33" y2="148" stroke="#000000" stroke-width="2" />
        <line x1="50" y1="125" x2="67" y2="148" stroke="#000000" stroke-width="2" />
        <text x="50" y="165" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Khách Hàng</text>
        <text x="50" y="179" font-size="11" fill="#444" text-anchor="middle">(Sinh Viên)</text>

        <!-- Lifeline 1: Frontend Box -->
        <rect x="150" y="65" width="230" height="58" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="265" y="85" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Đường dẫn vào frontend:</text>
        <text x="265" y="103" font-size="10.5" fill="#000000" text-anchor="middle">D:\24CT1-PHANTRIDUC\src\</text>
        <text x="265" y="117" font-size="10.5" fill="#000000" text-anchor="middle">views\HousingView.jsx</text>

        <!-- Lifeline 2: Backend Box -->
        <rect x="440" y="65" width="220" height="58" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="550" y="85" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Đường dẫn vào file backend:</text>
        <text x="550" y="103" font-size="10.5" fill="#000000" text-anchor="middle">D:\24CT1-PHANTRIDUC\api\</text>
        <text x="550" y="117" font-size="10.5" fill="#000000" text-anchor="middle">housing.php</text>

        <!-- Lifeline 3: Database Cylinder -->
        <path d="M 720,77 A 70,12 0 0,1 860,77 A 70,12 0 0,1 720,77 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <path d="M 720,77 L 720,115 A 70,12 0 0,0 860,115 L 860,77" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="790" y="93" font-size="11.5" font-weight="bold" fill="#000000" text-anchor="middle">Tên CSDL / bảng hỗ trợ:</text>
        <text x="790" y="109" font-size="11" fill="#000000" text-anchor="middle">unilife_db / housing</text>

        <!-- Lifelines dashed -->
        <line x1="50" y1="185" x2="50" y2="660" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,4" />
        <line x1="265" y1="125" x2="265" y2="660" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,4" />
        <line x1="550" y1="125" x2="550" y2="660" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,4" />
        <line x1="790" y1="125" x2="790" y2="660" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,4" />

        <!-- Activations -->
        <rect x="45" y="195" width="10" height="450" fill="#ffffff" stroke="#000000" stroke-width="1" />
        <rect x="260" y="200" width="10" height="440" fill="#ffffff" stroke="#000000" stroke-width="1" />
        <rect x="545" y="260" width="10" height="310" fill="#ffffff" stroke="#000000" stroke-width="1" />
        <rect x="785" y="290" width="10" height="200" fill="#ffffff" stroke="#000000" stroke-width="1" />

        <!-- Step 1 -->
        <line x1="55" y1="205" x2="260" y2="205" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
        <text x="155" y="196" font-size="10.5" fill="#000000" text-anchor="middle">1. Nhập từ khóa tìm kiếm (tên, địa chỉ) &amp; chọn tiện ích, mức giá</text>

        <!-- Step 2 -->
        <line x1="260" y1="230" x2="75" y2="230" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-open)" />
        <text x="165" y="224" font-size="10" fill="#000000" text-anchor="middle">2. Tiếp nhận bộ lọc (setQuery, setFilters, setPriceMax)</text>

        <!-- Step 3 -->
        <line x1="270" y1="260" x2="545" y2="260" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
        <text x="400" y="252" font-size="10.5" fill="#000000" text-anchor="middle">3. Gửi yêu cầu lấy danh sách phòng trọ: GET /api/housing.php</text>

        <!-- Step 4 -->
        <line x1="555" y1="290" x2="785" y2="290" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
        <text x="670" y="278" font-size="9" fill="#000000" text-anchor="middle">4. Truy vấn CSDL: SELECT id, name, price, price_num,</text>
        <text x="670" y="289" font-size="9" fill="#000000" text-anchor="middle">area, address, dist, ac, washer, wifi... FROM housing ORDER BY id DESC</text>

        <!-- ALT BOX -->
        <rect x="460" y="315" width="410" height="215" fill="none" stroke="#000000" stroke-width="1.2" />
        <rect x="460" y="315" width="50" height="20" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
        <text x="485" y="330" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">alt</text>

        <!-- Branch 1: Fail -->
        <text x="470" y="348" font-size="10" fill="#b91c1c" font-style="italic">[Trường hợp không tìm thấy phòng trọ hoặc lỗi kết nối CSDL]</text>
        <line x1="785" y1="365" x2="555" y2="365" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-red)" />
        <text x="670" y="360" font-size="9" fill="#b91c1c" text-anchor="middle">5a. Bảng housing rỗng (num_rows === 0) hoặc kết nối CSDL thất bại</text>

        <line x1="545" y1="390" x2="270" y2="390" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-red)" />
        <text x="410" y="384" font-size="9.5" fill="#b91c1c" text-anchor="middle">6a. JSON {"success": true, "housing": []}</text>

        <line x1="260" y1="410" x2="55" y2="410" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-red)" />
        <text x="155" y="404" font-size="9.5" fill="#b91c1c" text-anchor="middle">7a. Hiển thị EmptyState: 'Không tìm thấy phòng phù hợp...'</text>

        <!-- Divider line -->
        <line x1="460" y1="425" x2="870" y2="425" stroke="#000000" stroke-width="1" stroke-dasharray="4,4" />

        <!-- Branch 2: Success -->
        <text x="470" y="442" font-size="10" fill="#15803d" font-style="italic">[Trường hợp tìm thấy dữ liệu phòng trọ]</text>
        <line x1="785" y1="460" x2="555" y2="460" stroke="#15803d" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-green)" />
        <text x="670" y="455" font-size="9" fill="#15803d" text-anchor="middle">5b. Trả về tập dữ liệu (id, name, price, priceNum, area, address, ac, washer, wifi...)</text>

        <line x1="555" y1="478" x2="585" y2="478" stroke="#15803d" stroke-width="1" />
        <line x1="585" y1="478" x2="585" y2="495" stroke="#15803d" stroke-width="1" />
        <line x1="585" y1="495" x2="555" y2="495" stroke="#15803d" stroke-width="1" marker-end="url(#arrow-green)" />
        <text x="675" y="492" font-size="9" fill="#15803d">6b. Định dạng dữ liệu: ac, wifi, parking (bool), priceNum (float)</text>

        <line x1="545" y1="518" x2="270" y2="518" stroke="#15803d" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-green)" />
        <text x="410" y="512" font-size="9.5" fill="#15803d" text-anchor="middle">7b. Trả về JSON mảng danh sách phòng trọ {"success": true, "housing": [...]}</text>

        <!-- Step 8 -->
        <line x1="545" y1="550" x2="270" y2="550" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-open)" />
        <text x="410" y="544" font-size="10" fill="#000000" text-anchor="middle">8. Nhận danh sách phòng trọ &amp; lưu vào state housingList</text>

        <!-- Step 9 (self loop) -->
        <line x1="270" y1="575" x2="310" y2="575" stroke="#000000" stroke-width="1" />
        <line x1="310" y1="575" x2="310" y2="600" stroke="#000000" stroke-width="1" />
        <line x1="310" y1="600" x2="270" y2="600" stroke="#000000" stroke-width="1" marker-end="url(#arrow)" />
        <text x="318" y="587" font-size="10" fill="#000000">9. filteredHousing()</text>
        <text x="318" y="600" font-size="9" fill="#555555">(Lọc từ khóa, tiện ích, mức giá tối đa)</text>

        <!-- Step 10 -->
        <line x1="260" y1="628" x2="55" y2="628" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-open)" />
        <text x="155" y="622" font-size="10.5" fill="#000000" text-anchor="middle">10. Hiển thị danh sách thẻ phòng trọ (PlaceCard.jsx) lên giao diện</text>

        <!-- Markers definition -->
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
          </marker>
          <marker id="arrow-open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <polyline points="1 1, 9 5, 1 9" fill="none" stroke="#000000" stroke-width="1.5" />
          </marker>
          <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <polyline points="1 1, 9 5, 1 9" fill="none" stroke="#b91c1c" stroke-width="1.5" />
          </marker>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <polyline points="1 1, 9 5, 1 9" fill="none" stroke="#15803d" stroke-width="1.5" />
          </marker>
        </defs>
      </svg>