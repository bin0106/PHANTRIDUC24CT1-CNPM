  <text x="895" y="910" font-size="11.5" fill="#64748B">• Đặt các trường bắt buộc (*) theo thứ tự logic</text>
  <text x="895" y="930" font-size="11.5" fill="#64748B">• Kích thước nút CTA rộng 100% giúp tăng tỷ lệ bấm</text>
  <text x="895" y="950" font-size="11.5" fill="#64748B">• Icon trực quan bên trong ô input hỗ trợ nhận diện</text>
  <text x="895" y="970" font-size="11.5" fill="#64748B">• Cung cấp lối thoát (nút X góc phải &amp; link Đăng nhập)</text>


